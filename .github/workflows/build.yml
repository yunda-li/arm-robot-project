name: build ROS2 packages
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - gha-workflow
jobs:
  build:
    runs-on: ubuntu-22.04
    container: ros:humble
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          rosdep update
          # Remove -r once orocos_kdl is sorted out in soarm_scripts
          rosdep install --from-paths src --ignore-src -r -y --skip-keys "warehouse_ros_mongo"
      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --event-handlers console_cohesion+ --cmake-args -DCMAKE_BUILD_TYPE=Release
        
      


      
    
