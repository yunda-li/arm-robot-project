arm_move_group:
  kinematics_solver: pick_ik/PickIkPlugin
  kinematics_solver_timeout: 1.0
  mode: global
  position_scale: 0.7
  rotation_scale: 0.3 #Set to 0 for position only IK
  position_threshold: 0.05
  orientation_threshold: 0.1
  approximate_solution_position_threshold: 0.4
  approximate_solution_orientation_threshold: 0.4
  cost_threshold: 0.001
  center_joints_weight: 0.1
  avoid_joint_limits_weight: 0.1
  minimal_displacement_weight: 0.001

